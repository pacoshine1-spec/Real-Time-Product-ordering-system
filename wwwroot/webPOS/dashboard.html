<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            margin: 0;
        }

        .header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>POS DASHBOARD</h2>
</div>

<div class="container">

    <div class="card">
        <h3>Welcome</h3>
        <p id="userInfo">Loading user...</p>
    </div>

    <div class="card">
        <h3>System Status</h3>
        <p>API Connected ✔</p>
    </div>

</div>

<script>
    const user = JSON.parse(localStorage.getItem("user"));

    if (user) {
        document.getElementById("userInfo").innerText =
            "Logged in as: " + user.user.username;
    } else {
        document.getElementById("userInfo").innerText =
            "No user data found";
    }
</script>

</body>
</html>
